<div class="h-full bg-green-white rounded-lg pb-3 overflow-clip flex flex-col">
  <img class="max-h-64 inset-shadow-sm" src="/demo/{{ id() }}.jpg" alt="" />
  <div class="font-serif m-3 text-sm">
    <h2 class="text-lg">{{ title() }}</h2>
    <br />
    <ul class="ml-4">
      <li class="list-disc">Bedrooms: {{ bedrooms() }}.</li>
      <li class="list-disc">Bathrooms: {{ bathrooms() }}.</li>
      <li class="list-disc">Parking: {{ hasParking() ? 'Yes' : 'No' }}.</li>
    </ul>
    <br />
    Price: ${{ price() }}.
  </div>

  <div class="grow"></div>

  <div class="mx-3 flex gap-3">
    <app-button (atClick)="buyRealState.emit(id())" class="grow" text="Buy" />
  </div>
</div>
