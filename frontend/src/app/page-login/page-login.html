<!-- eslint-disable @angular-eslint/template/interactive-supports-focus -->
<!-- eslint-disable @angular-eslint/template/click-events-have-key-events -->

<svg
  (click)="goBack()"
  xmlns="http://www.w3.org/2000/svg"
  class="fixed top-6 left-6 size-10 cursor-pointer"
  viewBox="0 0 512 512"
>
  <path
    fill="none"
    stroke="currentColor"
    stroke-linecap="square"
    stroke-miterlimit="10"
    stroke-width="48"
    d="M244 400L100 256l144-144M120 256h292"
  />
</svg>

@if (name() === '') {
  <div class="h-dvh bg-green-white-2 grid place-items-center font-serif">
    <div class="flex flex-col items-center">
      <img class="w-96 mb-16" src="/full-logo.jpeg" alt="" />
      <div class="flex gap-3 items-center">
        <span>Log in with:</span>
        <button
          (click)="doLogin()"
          type="button"
          class="bg-white p-3 rounded-lg flex gap-3 font-sans cursor-pointer"
        >
          <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"
            />
            <path d="M1 1h22v22H1z" fill="none" />
          </svg>
          <span>Google</span>
        </button>
      </div>
    </div>
  </div>
} @else {
  <div class="grid items-center bg-green-white-2 min-h-dvh font-serif">
    <div class="flex flex-col p-10 items-center">
      <img class="w-20 h-20 rounded-full mb-3" src="{{ pfpUrl() }}" alt="" />
      <span class="mb-3">
        {{ name() }}
      </span>

      <span class="mb-3"> Email: {{ email() }} </span>

      <app-button class="w-30 text-lg" (atClick)="doLogOut()" text="Log out" />
    </div>
  </div>
}
