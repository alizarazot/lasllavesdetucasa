<app-topbar class="fixed top-0 left-0 w-full" />

<main class="bg-green-white-2 font-serif min-h-dvh pt-30 flex flex-col items-center">
  <h2 class="text-2xl mb-8">{{ realState().title }}</h2>
  <img class="w-2xl rounded mb-8" src="/demo/{{ realState().id }}.jpg" alt="" />
  <span class="mb-8">
    {{ realState().description }}
  </span>

  <div class="flex gap-3 mb-8">
    <div class="bg-green-white p-3 rounded-lg flex flex-col items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-25 w-25" viewBox="0 0 512 512">
        <path
          d="M432 224V96a16 16 0 00-16-16H96a16 16 0 00-16 16v128a48 48 0 00-48 48v160h36v-32h376v32h36V272a48 48 0 00-48-48zm-192 0H120v-32a16 16 0 0116-16h88a16 16 0 0116 16zm32-32a16 16 0 0116-16h88a16 16 0 0116 16v32H272z"
        />
      </svg>
      Bedrooms: {{ realState().bedrooms }}
    </div>
    <div class="bg-green-white p-3 rounded-lg flex flex-col items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-25 w-25" viewBox="0 0 512 512">
        <path
          d="M256 43.91s-144 158.3-144 270.3c0 88.36 55.64 144 144 144s144-55.64 144-144c0-112-144-270.3-144-270.3zm16 362.3v-24a60.07 60.07 0 0060-60h24a84.09 84.09 0 01-84 84z"
        />
      </svg>
      Bathrooms: {{ realState().bathrooms }}
    </div>
    <div class="bg-green-white p-3 rounded-lg flex flex-col items-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-25 w-25" viewBox="0 0 512 512">
        <path
          d="M447.68 220.78a16.44 16.44 0 00-1-3.1l-48-112A16 16 0 00384 96H128a16 16 0 00-14.71 9.7l-48 112a16.44 16.44 0 00-1 3.1A16.15 16.15 0 0064 224v184a8 8 0 008 8h32a8 8 0 008-8v-24h288v24a8 8 0 008 8h32a8 8 0 008-8V224a16.15 16.15 0 00-.32-3.22zM144 320a32 32 0 1132-32 32 32 0 01-32 32zm224 0a32 32 0 1132-32 32 32 0 01-32 32zM104.26 208l34.29-80h234.9l34.29 80z"
        />
      </svg>
      Parking: {{ realState().hasParking ? 'Yes' : 'No' }}.
    </div>
  </div>

  <span class="text-4xl mb-8"> Price: ${{ realState().price }} </span>

  <div class="mb-8 gap-3 flex">
    <app-button (atClick)="showContract()" text="See contract preview" />
    <app-button (atClick)="navigateContractSummary()" text="Check out AI advice!" />
  </div>

  <div class="flex flex-col items-center gap-3">
    <div class="flex gap-3 items-center">
      <label for="email">Your email:</label>
      <input
        class="bg-green-white rounded-lg p-2 outline-0"
        name="email"
        [(ngModel)]="email"
        type="email"
      />
    </div>
    <div class="flex gap-3 mb-8">
      <input
        [(ngModel)]="date"
        class="bg-green-white rounded-lg px-2 outline-0"
        type="date"
        min="{{ currentDate }}"
      />
      <input
        [(ngModel)]="hour"
        class="bg-green-white rounded-lg px-2 outline-0"
        type="time"
        min="{{ currentHour }}"
      />
      <app-button (atClick)="sendEmail()" text="{{ text() }}" />
    </div>
  </div>
</main>
